<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
  </defs>
  <!-- Outer circle with subtle gradient -->
  <circle cx="15" cy="15" r="14" fill="url(#redGrad)" stroke="#a00000" stroke-width="1"/>
  <!-- Inner subtle highlight ring -->
  <circle cx="15" cy="15" r="12.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.75"/>
  <!-- Text with slight shadow for depth -->
  <text x="15" y="15.5" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="700"
        fill="rgba(0,0,0,0.25)" letter-spacing="-0.3">16+</text>
  <text x="15" y="15" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="700"
        fill="white" letter-spacing="-0.3">16+</text>
</svg>